<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAWCRAFT — Aktualizacja panelu</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0,#6d4d262c,transparent 65%),#111821;color:#eef2f8;font:15px/1.6 'Segoe UI',sans-serif}.update{width:min(480px,90vw);padding:26px;text-align:center}.logo{width:180px;height:180px;object-fit:contain;filter:drop-shadow(0 12px 35px #dca63530)}.brand{color:#e5b25d;font-size:11px;font-weight:700;letter-spacing:3px;margin:6px 0}h1{font-size:27px;letter-spacing:-.7px;margin:8px 0}p{color:#a9b6c8;margin:10px 0}.version{font-size:12px;color:#d5b477}.track{height:7px;border-radius:7px;background:#263142;overflow:hidden;margin:24px 0 14px}.track span{height:100%;display:block;width:10%;background:linear-gradient(90deg,#b57f25,#f2c874);transition:width .35s}.steps{display:flex;justify-content:space-between;font-size:11px;color:#7f90a5}.foot{font-size:11px;color:#6f8095;margin-top:26px}.error .track span{background:#d76672}.error #message{color:#f4a8b3}
</style></head><body><main class="update"><img class="logo" src="{{.Base}}/logo.png" alt="RAWCRAFT"><div class="brand">RAWCRAFT CONTROL</div><h1>Aktualizacja panelu</h1><div class="version">Wersja {{.Version}}</div><p id="message" role="status" aria-live="polite">Przygotowywanie aktualizacji…</p><div class="track" role="progressbar" aria-label="Postęp aktualizacji" aria-valuemin="0" aria-valuemax="100" aria-valuenow="10"><span id="bar"></span></div><div class="steps"><span>Weryfikacja</span><span>Instalacja</span><span>Gotowe</span></div><p class="foot" id="foot">Panel otworzy się automatycznie.<br>Twoje usługi na VPS nadal działają.</p></main><script>
async function poll(){try{let r=await fetch('{{.Base}}/status',{cache:'no-store'});if(!r.ok)throw Error();let d=await r.json();document.getElementById('message').textContent=d.message;document.getElementById('bar').style.width=d.percent+'%';document.querySelector('.track').setAttribute('aria-valuenow',d.percent);document.body.classList.toggle('error',d.state==='error');document.getElementById('foot').innerHTML=d.state==='error'?'Panel nie zostanie otwarty.<br>Zamknij okno i użyj instalatora z GitHub.':'Panel otworzy się po udanej aktualizacji.<br>Twoje usługi na VPS nadal działają.'}catch(e){document.getElementById('message').textContent='Oczekiwanie na aktualizator…'}}poll();setInterval(poll,350);
</script></body></html>
